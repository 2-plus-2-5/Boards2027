function pace(s){var x=stat(s),l=left(s),r=x.a-x.d;if(l<0)return'This one is done.';if(!r)return'Every topic is ticked. Use the days left to revise.';if(l===0)return'Exam day. All the best!';var per=r/Math.max(l-7,1);return per>=1?'About '+Math.ceil(per)+' topics a day finishes the syllabus a week early.':'One topic every '+Math.max(1,Math.floor(1/per))+' days finishes the syllabus a week early.'}
function tb(mid,right){return '<header class="tb"><button class="logo a lime" data-mode="choose" aria-label="Back to choose">'+M[mode].logo+'</button>'+(mid?'<div class="pill mid a">'+mid+'</div>':'')+right+'</header>'}
function cur(s,label){var x=stat(s),l=left(s);return '<div class="hd" data-id="'+s.id+'"><div class="lbl a"><span>'+label+'</span><i class="dot"></i><span class="lime">Live</span></div><h1 class="title a">'+esc(s.n)+'</h1><div class="dl a"><span class="'+cls(l)+'">'+Math.max(l,0)+'</span> days left</div><p class="dts">'+fmt(s)+'</p><p class="tip">Tap to open · swipe to switch</p></div><div class="mk a lime"><span>Done '+x.d+'</span><span>Left '+(x.a-x.d)+'</span></div>'+wave(s)}
function agent(s){return '<div class="ag a"><span class="lime">Agent</span><span>'+pace(s)+'</span></div>'}
function sub(){return SUBJ.filter(function(x){return x.id===view})[0]}
function pct(list){var A=0,D=0;list.forEach(function(o){var x=stat(o);A+=x.a;D+=x.d});return A?Math.round(D/A*100):0}
function nextLeft(list){var l=list.map(left).filter(function(n){return n>=0});return l.length?Math.min.apply(null,l):0}
function chooser(){return '<div class="chs"><button class="ch c1" data-mode="boards"><span class="w a">Boards27</span></button><button class="ch c2" data-mode="ipmat"><span class="w a">IPMAT27</span></button></div>'}
function home(){
var L=order();fi=((fi%L.length)+L.length)%L.length;var s=L[fi],A=0,D=0;
SUBJ.forEach(function(o){var x=stat(o);A+=x.a;D+=x.d});var P=A?Math.round(D/A*100):0;
var h=tb('','<div class="pill a">'+D+' / '+A+' topics</div>');
h+='<section class="deck"><div class="cv'+(dir?(dir>0?' fl':' fr'):'')+'">'+cur(s,M[mode].unit+' '+(fi+1)+' of '+L.length)+'</div><aside class="side"><div class="rw">'+ring(P,170)+'<div class="rt"><div><b class="a">'+P+'%</b><span class="a">overall</span></div></div></div></aside></section>';
h+=agent(s)+'<div class="btns"><button class="skip a" data-skip="1">Skip</button><button class="a" data-go="'+s.id+'">Open</button></div><h3 class="lib a">All '+M[mode].units+'</h3>';
SUBJ.slice().sort(byDate).forEach(function(o,i){var x=stat(o),l=left(o);
h+='<button class="pr" data-go="'+o.id+'"><span class="n a">0'+(i+1)+'</span><span class="pn a">'+esc(o.n)+'</span><span class="pd">'+fmt(o).replace(/^\w+, /,'')+'</span><span class="pb"><i style="width:'+x.p+'%"></i></span><span class="pp a">'+x.p+'%</span><span class="pdy a '+cls(l)+'">'+Math.max(l,0)+'D</span></button>'});
return h+'<p class="note">Progress saves on this device. Move your cursor, or tap anywhere, and the cat will come find you.</p>'}
function detail(s){
var an=dir?(dir>0?' fl':' fr'):'',x=stat(s),h=tb(M[mode].mid,'<button class="x" data-go="home" aria-label="Back">✕</button>');
h+='<section class="deck"><div class="cv2'+an+'">'+cur(s,M[mode].unit)+'</div><aside class="side"><div></div><div class="rw">'+ring(x.p,170)+'<div class="rt"><div><b class="a">'+x.p+'%</b><span class="a">done</span></div></div></div></aside></section>'+agent(s);
h+='<div class="tools"><input id="q" placeholder="Search topics" value="'+esc(q)+'" aria-label="Search topics">';
[['all','All'],['todo','Not done'],['done','Done']].forEach(function(f){h+='<button data-f="'+f[0]+'" class="'+(filter===f[0]?'on':'')+'">'+f[1]+'</button>'});
h+='<button data-all="1">Tick all</button><button data-reset="1">Reset</button></div><div class="topics'+an+'">';
var n=0;
topics(s).forEach(function(g){
var rows=g.t.filter(function(t){var d=isDone(s,t);return(filter==='all'||(filter==='done')===d)&&t.toLowerCase().indexOf(q.toLowerCase())>-1});
if(!rows.length)return;h+='<div class="sec a">'+esc(g.h)+'</div>';
rows.forEach(function(t){n++;var d=isDone(s,t);
h+='<div class="row'+(d?' done':'')+'"><span class="nm">'+esc(t)+'</span><span><select data-t="'+esc(t)+'" aria-label="Status of '+esc(t)+'"><option value="0"'+(d?'':' selected')+'>Not done</option><option value="1"'+(d?' selected':'')+'>Done</option></select>'+(g.h==='My additions'?'<button class="rm" data-rm="'+esc(t)+'" aria-label="Remove topic">✕</button>':'')+'</span></div>'});
});
if(!n)h+='<div class="empty">Nothing matches. Clear the search or change the filter.</div>';
return h+'</div><div class="tools"><input id="add" placeholder="Add your own topic, like a PYQ set" aria-label="Add topic"><button data-add="1">Add topic</button></div>'}
function fit(){document.querySelectorAll('.title,.pn,.iw,.w').forEach(function(e){e.style.fontSize='';var a=e.scrollWidth,c=e.classList.contains('iw')?innerWidth-32:e.clientWidth;if(c&&a>c+1)e.style.fontSize=(parseFloat(getComputedStyle(e).fontSize)*c/a*.97)+'px'})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);addEventListener('resize',fit);
function render(){var s=sub();document.getElementById('app').innerHTML=mode==='choose'?chooser():(s?detail(s):home());dir=0;fit()}
function go(v){view=v;filter='all';q='';location.hash=v==='home'?'':v;render();window.scrollTo(0,0)}
function intro(word,name,ds,hh,mm,inst){
var el=document.getElementById('intro'),p=ds.split('-'),T=new Date(+p[0],p[1]-1,+p[2],hh,mm,0),done=false;
ito.forEach(clearTimeout);ito=[];if(window.iiv)clearInterval(window.iiv);
el.className=inst?'s1 ns':'';el.style.display='grid';el.querySelector('.iw').textContent=word;document.getElementById('itl').textContent='until '+name;
document.body.style.overflow='hidden';fit();
function pad(v){return v<10?'0'+v:''+v}
function t(){var S=Math.floor(Math.max(0,T-new Date())/1000),v=[Math.floor(S/86400),Math.floor(S%86400/3600),Math.floor(S%3600/60),S%60];['td','th','tm','ts'].forEach(function(k,i){document.getElementById(k).textContent=pad(v[i])})}
t();window.iiv=setInterval(t,1000);
function end(){if(done)return;done=true;el.classList.add('out');ito.push(setTimeout(function(){clearInterval(window.iiv);el.style.display='none';el.className='';document.body.style.overflow=''},1100))}
var d2=inst?500:1900;if(inst)ito.push(setTimeout(function(){el.classList.remove('ns')},80));else ito.push(setTimeout(function(){el.classList.add('s1')},150));ito.push(setTimeout(function(){el.classList.add('s2')},d2));ito.push(setTimeout(end,d2+3100));el.onclick=end}
var picking=false;
function pick(b,m){
if(picking)return;
if(matchMedia('(prefers-reduced-motion:reduce)').matches){choose(m);return}
picking=true;
var o=[].filter.call(document.querySelectorAll('.ch'),function(x){return x!==b})[0],r=b.getBoundingClientRect(),right=o.getBoundingClientRect().left>r.left;
o.style.transition='transform .65s cubic-bezier(.7,0,.3,1),opacity .55s ease';o.style.transform='translateX('+(right?'':'-')+'120vw)';o.style.opacity='0';
var cl=b.cloneNode(true),w=cl.querySelector('.w');cl.removeAttribute('data-mode');cl.classList.add('zm');cl.setAttribute('aria-hidden','true');
cl.style.left=r.left+'px';cl.style.top=r.top+'px';cl.style.width=r.width+'px';cl.style.height=r.height+'px';
document.body.appendChild(cl);b.style.visibility='hidden';
var W=document.documentElement.clientWidth,bf=parseFloat(getComputedStyle(w).fontSize)||30,ie=document.getElementById('intro'),iw=ie.querySelector('.iw');
ie.className='';ie.style.visibility='hidden';ie.style.display='grid';iw.textContent=(m==='ipmat'?'IPMAT27':'Boards27');fit();var f=parseFloat(getComputedStyle(iw).fontSize)||48;ie.style.display='none';ie.style.visibility='';
void cl.offsetWidth;
cl.style.left='0px';cl.style.top='0px';cl.style.width=W+'px';cl.style.height=innerHeight+'px';cl.style.borderRadius='0px';cl.style.backgroundColor='#060606';cl.style.borderColor='#060606';
w.style.transform='scale('+(f/bf)+')';w.style.color='#ccff00';
setTimeout(function(){choose(m,true);setTimeout(function(){cl.remove();picking=false},90)},880)}
function choose(m,inst){
if(m==='choose'){mode='choose';SUBJ=BOARDS;view='home';location.hash='';render();window.scrollTo(0,0);return}
mode=m;SUBJ=m==='ipmat'?IPMAT:BOARDS;view='home';fi=0;filter='all';q='';location.hash='';render();window.scrollTo(0,0);
if(m==='ipmat')intro('IPMAT27','IPMAT','2027-04-24',14,0,inst);
else{var L=order();if(L.length&&left(L[0])>=0)intro('Boards27',L[0].n,L[0].d,10,30,inst)}}
document.addEventListener('click',function(e){
var hd=e.target.closest('.hd');if(hd&&mode!=='choose'&&!sub()&&matchMedia('(max-width:760px)').matches){go(hd.dataset.id);return}
var b=e.target.closest('button');if(!b)return;var s=sub();
if(b.dataset.mode){if(mode==='choose'&&b.classList.contains('ch'))pick(b,b.dataset.mode);else choose(b.dataset.mode);return}
if(b.dataset.skip){fi++;dir=1;render();return}
if(b.dataset.go){go(b.dataset.go);return}
if(b.dataset.f){filter=b.dataset.f;render();return}
if(!s)return;
if(b.dataset.all){st.done[s.id]=st.done[s.id]||{};topics(s).forEach(function(g){g.t.forEach(function(t){st.done[s.id][t]=true})});save();render()}
if(b.dataset.reset&&confirm('Reset all progress for '+s.n+'?')){st.done[s.id]={};save();render()}
if(b.dataset.rm){st.extra[s.id]=(st.extra[s.id]||[]).filter(function(t){return t!==b.dataset.rm});save();render()}
if(b.dataset.add){var v=document.getElementById('add').value.trim();if(v&&topics(s).every(function(g){return g.t.indexOf(v)<0})){(st.extra[s.id]=st.extra[s.id]||[]).push(v);save();render()}}
});
document.addEventListener('change',function(e){var el=e.target,s=sub();if(!el.dataset.t||!s)return;st.done[s.id]=st.done[s.id]||{};st.done[s.id][el.dataset.t]=el.value==='1';save();render()});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;var p=e.target.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='add'){var b=document.querySelector('[data-add]');b&&b.click()}});
function route(){var h=location.hash.slice(1),f=BOARDS.concat(IPMAT).filter(function(x){return x.id===h})[0];
if(f){mode=IPMAT.indexOf(f)>-1?'ipmat':'boards';SUBJ=mode==='ipmat'?IPMAT:BOARDS;view=h}else view='home';render()}
window.addEventListener('hashchange',route);route();
var sx=0,sy=0,sw=false;
document.addEventListener('touchstart',function(e){sw=!!e.target.closest('.hd');if(sw){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',function(e){if(!sw)return;sw=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){dir=dx<0?1:-1;var cs=sub();if(cs){var A=SUBJ.slice().sort(byDate),n=A[(A.indexOf(cs)+dir+A.length)%A.length];view=n.id;filter='all';q='';history.replaceState(null,'','#'+n.id)}else fi+=dir;render()}},{passive:true});
/* the cat */
var cat=document.getElementById('cat'),cf=document.getElementById('cf'),eyes=document.getElementById('eyes'),inn=cat.firstChild;
var cx=innerWidth-80,cy=innerHeight-60,tx=cx,ty=cy,last=Date.now(),flip=false;
function aim(x,y){tx=x;ty=y;last=Date.now()}
addEventListener('pointermove',function(e){aim(e.clientX,e.clientY)});
addEventListener('pointerdown',function(e){aim(e.clientX,e.clientY)});
addEventListener('touchmove',function(e){var t=e.touches[0];if(t)aim(t.clientX,t.clientY)},{passive:true});
var ltr='',lit='',lft='',let_='';
function tick(){
var dx=tx-cx,dy=ty-cy,d=Math.hypot(dx,dy),walk=d>60;
if(walk){var sp=Math.min(2.6,(d-60)*.035+.5);cx+=dx/d*sp;cy+=dy/d*sp;if(Math.abs(dx)>6)flip=dx<0}
var idle=Date.now()-last,si=!walk&&idle>2000,sl=!walk&&idle>7000;
cat.classList.toggle('walk',walk);cat.classList.toggle('sit',si);cat.classList.toggle('sleep',sl);
var tr='translate3d('+Math.round(cx-32)+'px,'+Math.round(cy-44)+'px,0)';if(tr!==ltr){cat.style.transform=tr;ltr=tr}
var it=sl?'translateY(5px) scaleY(.92)':'';if(it!==lit){inn.style.transform=it;lit=it}
var ft=flip?'translate(64 0) scale(-1 1)':'';if(ft!==lft){cf.setAttribute('transform',ft);lft=ft}
var k=flip?-1:1,et='translate('+Math.round(Math.max(-1.3,Math.min(1.3,dx/60))*k*10)/10+' '+Math.round(Math.max(-1,Math.min(1,dy/60))*10)/10+')';if(et!==let_){eyes.setAttribute('transform',et);let_=et}
requestAnimationFrame(tick)}
tick();
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
